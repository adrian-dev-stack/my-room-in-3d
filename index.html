<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>My Room in 3D — FiveM Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D WebGL Canvas -->
    <canvas id="webgl" class="webgl"></canvas>

    <!-- Top Left Performance Stats -->
    <div id="stats-container" class="stats-hud"></div>

    <!-- Top Navigation Glass Island -->
    <header class="top-nav-bar">
      <div class="brand-badge">
        <span class="live-dot"></span>
        <div class="brand-text">
          <span class="brand-title">3D WORKSPACE</span>
          <span class="brand-sub">FiveM Player</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="nav-action-btn" id="btn-sound-mute" title="Toggle Sound (Mute/Unmute)">
          <span class="btn-icon">🔊</span>
          <span class="btn-tooltip">Sound</span>
        </button>

        <button class="nav-action-btn" id="btn-fullscreen" title="Toggle Fullscreen">
          <span class="btn-icon">⛶</span>
          <span class="btn-tooltip">Fullscreen</span>
        </button>

        <button class="nav-action-btn" id="btn-settings-gui" title="Toggle Settings Panel">
          <span class="btn-icon">⚙️</span>
          <span class="btn-tooltip">Tweak Lights</span>
        </button>
      </div>
    </header>

    <!-- Unified Floating Bottom Control Dock -->
    <nav class="bottom-dock-wrapper" aria-label="Room Controls Dock">
      <div class="bottom-dock">
        <!-- Atmosphere Presets Group -->
        <div class="dock-section">
          <span class="dock-section-title">Atmosphere</span>
          <div class="dock-pill-group">
            <button class="preset-pill active" data-preset="Cyberpunk Night">
              <span class="pill-icon">🌌</span>
              <span class="pill-label">Cyberpunk</span>
            </button>
            <button class="preset-pill" data-preset="Sunset Studio">
              <span class="pill-icon">🌆</span>
              <span class="pill-label">Sunset</span>
            </button>
            <button class="preset-pill" data-preset="Clean Daylight">
              <span class="pill-icon">☀️</span>
              <span class="pill-label">Daylight</span>
            </button>
            <button class="preset-pill" data-preset="Cozy Lo-Fi">
              <span class="pill-icon">🕯️</span>
              <span class="pill-label">Cozy</span>
            </button>
          </div>
        </div>

        <div class="dock-divider"></div>

        <!-- Camera Views Group -->
        <div class="dock-section">
          <span class="dock-section-title">Camera</span>
          <div class="dock-pill-group">
            <button class="cam-pill active" data-cam="Isometric">
              <span class="pill-icon">📐</span>
              <span class="pill-label">Room</span>
            </button>
            <button class="cam-pill" data-cam="Desk Setup">
              <span class="pill-icon">🖥️</span>
              <span class="pill-label">Desk</span>
            </button>
            <button class="cam-pill" data-cam="Bed Corner">
              <span class="pill-icon">🛏️</span>
              <span class="pill-label">Bed</span>
            </button>
          </div>
        </div>

        <div class="dock-divider"></div>

        <!-- Lo-Fi Radio Player Group -->
        <div class="dock-section dock-radio-section" id="radio-widget">
          <div class="radio-main-info">
            <span class="radio-icon" id="radio-channel-icon">☕</span>
            <div class="radio-meta">
              <span class="radio-badge">Lo-Fi Radio</span>
              <span class="radio-title" id="radio-channel-name">Lo-Fi Chill Beats</span>
            </div>
            <!-- Equalizer Waveform -->
            <div class="equalizer-bars" id="radio-equalizer">
              <span class="bar bar-1"></span>
              <span class="bar bar-2"></span>
              <span class="bar bar-3"></span>
              <span class="bar bar-4"></span>
            </div>
          </div>

          <div class="radio-dock-controls">
            <button class="dock-btn-icon" id="radio-play-btn" title="Play / Pause Music">▶️</button>
            <button class="dock-btn-icon" id="radio-next-btn" title="Next Station">⏭️</button>
            <div class="dock-volume-slider">
              <span class="vol-icon">🔉</span>
              <input
                type="range"
                id="radio-volume"
                min="0"
                max="1"
                step="0.05"
                value="0.7"
                class="radio-volume-input"
                title="Volume"
              />
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Bottom Left Keybinding Hints -->
    <div class="key-hints-badge">
      <div class="hint-item"><span class="key-tag">Left Click</span> Orbit</div>
      <div class="hint-item"><span class="key-tag">Right Click</span> Pan</div>
      <div class="hint-item"><span class="key-tag">Scroll</span> Zoom</div>
      <div class="hint-item highlight"><span class="key-tag">Type Any Key</span> ⌨️ SFX</div>
    </div>

    <!-- Hotspot Interactive Tooltip -->
    <div id="tooltip" class="interactive-tooltip">
      <span class="tooltip-dot"></span>
      <span id="tooltip-text">Click to interact</span>
    </div>

    <!-- Interactive Terminal Modal Window -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div class="window-dots">
            <span class="dot dot-red" id="modal-close-btn"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <div class="modal-title" id="modal-title">Workstation Terminal</div>
          <button class="modal-close" id="modal-close-x">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <!-- Bottom Right Credits Footer -->
    <div class="footer-credit">
      <span>Built with Three.js by <strong class="author-name">FiveM Player</strong></span>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="source-link">(GitHub)</a>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
